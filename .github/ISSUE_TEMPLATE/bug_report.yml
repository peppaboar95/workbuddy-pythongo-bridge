name: Bug report
description: 报告不包含敏感信息的可复现问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请先删除真实账号、密钥、token、完整路径、数据库和未脱敏日志。安全问题请使用 Private vulnerability reporting。
  - type: input
    id: version
    attributes:
      label: Bridge 版本
      placeholder: 0.3.3
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: Windows、Python、无限易和 PythonGO 版本；不要填写真实账号。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: redaction
    attributes:
      label: 脱敏确认
      options:
        - label: 我已删除真实账号、密钥、token、数据库和未脱敏日志。
          required: true


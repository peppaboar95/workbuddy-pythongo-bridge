name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check installer syntax path
        run: cmd /c "首次安装与配置.cmd --syntax-check"

  quality-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install quality and build tools
        run: python -m pip install ruff "setuptools>=77" wheel
      - name: Static checks
        run: python -m ruff check src tests
      - name: Build release assets
        shell: pwsh
        run: .\tools\build_release.ps1
      - name: Verify wheel install
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -LiteralPath .\dist -Filter *.whl | Select-Object -First 1
          python -m pip install --force-reinstall $wheel.FullName
          python -c "import importlib.metadata as m, workbuddy_pythongo; assert workbuddy_pythongo.__version__ == m.version('workbuddy-pythongo-bridge')"
      - name: Verify wheel from path with spaces and CJK characters
        shell: pwsh
        run: |
          $sourceWheel = Get-ChildItem -LiteralPath .\dist -Filter *.whl | Select-Object -First 1
          $packageDir = Join-Path $env:RUNNER_TEMP "中文 安装包"
          $targetDir = Join-Path $env:RUNNER_TEMP "中文 Python环境"
          New-Item -ItemType Directory -Force -Path $packageDir, $targetDir | Out-Null
          $copiedWheel = Copy-Item -LiteralPath $sourceWheel.FullName -Destination $packageDir -PassThru
          python -m pip install --no-deps --target $targetDir $copiedWheel.FullName
          python -c "import sys; sys.path.insert(0, sys.argv[1]); import workbuddy_pythongo; print(workbuddy_pythongo.__version__)" $targetDir
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            dist/*.whl
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS.txt
